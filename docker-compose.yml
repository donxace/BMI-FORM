services:
  mysql:
    image: mysql:8.0
    container_name: bmi-form-mysql
    restart: unless-stopped
    environment:
      # Matches the empty-root-password convention backend/.env already
      # uses — this only binds to localhost on the host machine, so it's
      # no more exposed than XAMPP's MySQL was.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      # Host 3307 -> container 3306, deliberately NOT 3306:3306 — XAMPP's
      # own MySQL keeps 3306 for VITALS-FORM/VITALYZE-DEMO, which aren't
      # part of this migration. Update backend/.env's DB_PORT to match.
      - "3307:3306"
    volumes:
      - bmi_mysql_data:/var/lib/mysql
      # Runs once, only on first container creation (an empty volume) —
      # each file creates its own database, so this seeds both
      # bmi_monitoring and itms_inventech from the export taken
      # 2026-09-06. To re-seed from scratch: `docker compose down -v`.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bmi_mysql_data:
